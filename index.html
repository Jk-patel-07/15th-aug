<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Independence Day 🇮🇳 | 15 August</title>
  <meta name="description" content="A cinematic Independence Day experience celebrating 15 August, the spirit of freedom, unity, and India." />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Canvas for Pushp Varsha Flower Petal Shower -->
  <canvas id="petalCanvas"></canvas>

  <!-- ====================================================
       SINGLE-PAGE CINEMATIC INDEPENDENCE DAY EXPERIENCE
       ==================================================== -->
  <div id="cinematicExperience" class="cinematic-screen-real">
    <!-- Animated Photo Background Layer -->
    <div class="bg-photo-wrapper">
      <img src="./flag_bg.jpg" alt="Indian Flag Background" class="bg-photo-img animated-ken-burns" />
      <div class="bg-photo-overlay"></div>
      <div id="lightSweep" class="bg-light-sweep"></div>
    </div>

    <!-- Top Corner Controls -->
    <div class="top-controls">
      <button id="audioBtn" class="btn-audio-toggle" title="Toggle Patriotic Melody (Muted by default)" aria-label="Toggle Sound">
        <svg id="audioIconMute" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        <svg id="audioIconPlay" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
    </div>

    <!-- Centered Typography Content -->
    <div class="intro-content-centered">
      <div class="intro-typography" id="mainTypography">
        <span class="intro-happy reveal-1">HAPPY</span>
        <h1 class="intro-main-title reveal-2" id="titleText">INDEPENDENCE DAY</h1>
        <div class="intro-date-badge reveal-3">15 AUGUST</div>
        <p class="intro-patriot-line reveal-4" id="taglineText">Celebrating the spirit of freedom, unity and India.</p>
      </div>
    </div>

    <!-- Subtle Click Anywhere Hint & Celebratory Status -->
    <div class="click-continue-hint" id="bottomHint">
      <span id="hintText">CLICK ANYWHERE TO CELEBRATE 🇮🇳</span>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
